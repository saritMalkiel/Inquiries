services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: requests-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Pass123"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__Db: "Server=sqlserver,1433;Database=RequestsDb;User Id=sa;Password=Your_strong_Pass123;TrustServerCertificate=True"
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy

  ui:
    build:
      context: ./frontend
    ports:
      - "4200:4200"
    depends_on:
      - api

volumes:
  mssql-data:
