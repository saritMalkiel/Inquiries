name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Backend
        run: dotnet test requests-docker.sln -c Release

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build